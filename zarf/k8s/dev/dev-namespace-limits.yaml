# Bounds for namespace dedo-todo (declared in zarf/k8s/base/service). The
# service's container sets its own requests and limits; the LimitRange
# defaults only catch a container that forgets to.
apiVersion: v1
kind: LimitRange
metadata:
  name: dedo-todo
  namespace: dedo-todo
spec:
  limits:
  - type: Container
    default:
      cpu: 500m
      memory: 128Mi
    defaultRequest:
      cpu: 50m
      memory: 32Mi
    max:
      cpu: "1"
      memory: 512Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: dedo-todo
  namespace: dedo-todo
spec:
  hard:
    # The service, its database, the BFF, the frontend and the collector.
    requests.cpu: "1"
    requests.memory: 512Mi
    limits.cpu: "4"
    limits.memory: 1536Mi
    pods: "8"
