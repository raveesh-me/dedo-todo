# dedo-todo as it runs in every cluster: an overlay (zarf/k8s/dev for kind)
# adds what differs.
apiVersion: v1
kind: Namespace
metadata:
  name: dedo-todo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dedo-todo
  namespace: dedo-todo
  labels:
    app: dedo-todo
spec:
  selector:
    matchLabels:
      app: dedo-todo
  template:
    metadata:
      labels:
        app: dedo-todo
    spec:
      # Above the preStop sleep, so the pod leaves the Service before SIGTERM.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532 # distroless nonroot
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: service
        image: service-image
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: ADDR
          value: ":8080"
        - name: GOMAXPROCS
          valueFrom:
            resourceFieldRef:
              resource: limits.cpu
        # ~90% of limits.memory: headroom for memory the Go runtime does not
        # count, so the GC tightens before the cgroup OOM-kills the pod.
        - name: GOMEMLIMIT
          value: "115MiB"
        lifecycle:
          # Keep serving while kube-proxy drops the pod from the Service. The
          # sleep handler needs no shell.
          preStop:
            sleep:
              seconds: 5
        # GET /healthz is the server's, outside the interceptors: no token.
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
          failureThreshold: 2
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: "1"
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: dedo-todo
  namespace: dedo-todo
spec:
  selector:
    app: dedo-todo
  ports:
  - name: http
    port: 8080
    targetPort: http
