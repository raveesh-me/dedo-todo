# The frontend's server block, installed as /etc/nginx/conf.d/default.conf in
# docker.io/nginxinc/nginx-unprivileged (zarf/docker/dockerfile.frontend).
# That image's nginx.conf runs as uid 101 and keeps its pid and temp files in
# /tmp, so with /tmp writable (an emptyDir) the root filesystem can be
# read-only.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    # Redirects stay relative, so they work behind any host and port.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Both proxies keep the full original URI (proxy_pass has no URI part) and
    # pass every request header through, Authorization, location-id and
    # Version included. bff and dedo-todo are Services in the same namespace.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 60s;

    # The backend for frontend, pinned by commit SHA: /bff/<sha>/...
    location /bff/ {
        proxy_pass http://bff:8080;
    }

    # The Todo API, for commands.
    location /commerce/todo/v1/ {
        proxy_pass http://dedo-todo:8080;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed build output: the name changes whenever the content does.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The entry file is never cached, so a new deploy (and the BFF of its
    # commit) is picked up on the next load.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Everything else falls back to index.html (the SPA's views).
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
